l_russian:

############## Religions and Religious Traits ################

 atheist: "Humanism"

######### Interest Groups #############

# ig_orthodox_church: "Orthodox Church"
 ig_orthodox_church_desc: "A communion of Christian church communities headed by individual bishops and most prominant in Eastern Europe and the Caucasus."

# ig_oriental_orthodox_church: "Oriental Orthodox Church"
 ig_oriental_orthodox_church_desc: "A group of Christian churches stemming from the earliest days of Christianity and most prominant in Africa and South Asia."

 ig_anglican_church: "Church of England"
 ig_anglican_church_desc: "The Church of England (or the Anglican Church) was created by King Henry VIII during the Protestant Reformation and the British monarch serves as the official head of the Church. While officially protestant, the Anglican Church retained more of the heirarchy and character of the Roman Catholic Church than most other protestant churches and is often presented as a middle way or via media between Protestantism and Catholicism."

 ig_rabbinical_council: "Rabbinical Council"
 ig_rabbinical_council_desc: "The leadership of a country's Jewish populace tend to be well-educated Rabbis with strong traditions of debate and scholarship."

 ig_sunni_madrasahs: "Sunni Ulema"
 ig_sunni_madrasahs_desc: "Sunnism is the largest sect of Islam. Believers hold that Muhammad was succeeded as Caliph of Islam by his uncle, Abu Bakr, as opposed to the Shi'a view that his son-in-law Ali was the legitimate successor."

 ig_shia_madrasahs: "Shi'a Ulema"
 ig_shia_madrasahs_desc: "Shi'ism is the second largest sect of Islam. Believers hold that Muhammad was succeeded as Caliph of Islam by his son-in-law, Ali, as opposed to the Sunni view that his uncle Abu Bakr was the legitimate successor."

 ig_hindu_priesthood: "Hindu Priesthood"
 ig_hindu_priesthood_desc: "Probably the oldest organized religion still in existence, Hinduism holds that breaking the cycle of reincarnation and achieving Nirvana requires adherence to a caste system whereby individuals serve a role to improve their karma, just as the many gods worshiped by Hindus serve different roles."

 ig_vajrayana_monks: "Vajrayana Sangha"
 ig_vajrayana_monks_desc: "Vajrayana or Esoteric Buddhism is strongest in Tibet and Mongolia. It emphasizes the use of mantras and the transmission of teachings from directly from teacher to student."

 ig_mahayana_monks: "Mahayana Sangha"
 ig_mahayana_monks_desc: "Mahayana Buddhism is strongest in China, Vietnam and Korea. The multiple Buddhas and Bodhisattvas recognized by this chool are viewed as caring, compassionate, and sometimes supernatural beings that achieve enlightenment due to their wish to help others."

 ig_theravada_monks: "Theravada Sangha"
 ig_theravada_monks_desc: "Theravada Buddhism is strongest in Burma, Siam, Cambodia and Ceylon and is the oldest Buddist school. It places great emphasis on the teachings of Gautama Buddha, as preserved in the Pali Canon."

 ig_shinto_monks: "Shinto Kannushi"
 ig_shinto_monks_desc: "Shintoism is a native Japanese faith that primarily revolves around worship and placation of kami, the spirits of nature and dead ancestors."

 ig_scholar_officials: "Scholar-Officials"
 ig_scholar_officials_desc: "Empowered by the Imperial examination system, Confucian scholars wield considerable power and influence due to their prominent placement and symbiotic relationship with imperial power."

############################################## Ideologies ##############################################

 ideology_pious: "Pietist"
 ideology_pious_desc: "#lore Pietism is the belief in individual sanctification through day to day actions and often includes a dedication to charity and charitable works.#!"

############################################# Laws ######################################

 # Church and State group
# law_freedom_of_conscience: "Freedom of Conscience"
 law_freedom_of_conscience_desc: "The state supports and is supported by its state religion but any interpretation of the same core belief system is tolerated."
# law_total_separation: "Total Separation"
# law_total_separation_desc: "No church or faith may interfere in government functions. No religion may be discriminated against."
# law_state_atheism: "State Atheism"
 law_state_atheism_desc: "Preaching religious belief is prohibited, and professing belief in a god or gods is frowned upon."

 # Education System group
# law_no_schools: "No Schools"
 law_no_schools_desc: "There is no formal or structured education system. Only the most leisurely citizens learn to read and write."
# law_religious_schools: "Religious Schools"
 law_religious_schools_desc: "Clergy or religious scholars handle the practical and moral education of the populace."
# law_private_schools: "Private Schools"
 law_private_schools_desc: "A system of privately owned and run schools provides an education to those citizens with means."
# law_public_schools: "Public Schools"
 law_public_schools_desc: "The government funds schools and sets the curriculum that provides an education to its citizens."

 # Welfare group
# lawgroup_welfare: "Welfare"
 lawgroup_welfare_desc: "Assistance for the income deprived."
 law_no_social_security: "No Organized Welfare"
 law_no_social_security_desc: "Those who need help are at the mercy of their neighbors."
# law_poor_laws: "Poor Laws"
 law_poor_laws_desc: "Government organized workhouses provide support to the destitute in exchange for their labor and reduced liberties."
# law_wage_subsidies: "Wage Subsidies"
 law_wage_subsidies_desc: "The government subsidizes wages for the lowest earners to ensure that all who are willing to work have a right to eat."
# law_old_age_pension: "Old Age Pension"
 law_old_age_pension_desc: "The government provides for those who are too old or infirm to work."

 # Policing
 lawgroup_policing: "Law Enforcement"
 lawgroup_policing_desc: "How law and order are maintained."
# law_no_police: "No Police"
 law_no_police_desc: "Structured law enforcement does not exist in this country."
 law_local_police: "Local Jurisdiction"
 law_local_police_desc: "Local landowners provide some means for citizens to settle their disputes and keep order within their personal jurisdictions."
 law_dedicated_police: "Dedicated Police Force"
 law_dedicated_police_desc: "A dedicated police force enforces the nation's laws."
 law_militarized_police: "Militarized Police Force"
 law_militarized_police_desc: "A police force with military equipment and training enforces the will of the government."

